name: coin-archive

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coin_archive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_USER: ${POSTGRES_USER:-coin_archive}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 15
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  postgres-test:
    image: postgres:17-alpine
    profiles: ["integration-test"]
    environment:
      POSTGRES_DB: coin_archive_test
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_USER: coin_archive_test
    healthcheck:
      test:
        ["CMD-SHELL", "pg_isready -U coin_archive_test -d coin_archive_test"]
      interval: 1s
      timeout: 5s
      retries: 30
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data

volumes:
  postgres-data:
  postgres-test-data:
